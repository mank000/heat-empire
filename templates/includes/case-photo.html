{% load static %}
<div class="case-photo">
    <img class="case-photo__slide" src="{% static 'img/night-house.webp' %}" alt="Тепловой насос у дома зимой" loading="lazy">
    <img class="case-photo__slide" src="{% static 'img/winter-house.webp' %}" alt="Наружный блок теплового насоса у загородного дома" loading="lazy" hidden>
    <div class="case-photo__controls" hidden>
        <button type="button" data-step="-1" aria-label="Предыдущее фото">←</button>
        <span aria-live="polite">1 / 2</span>
        <button type="button" data-step="1" aria-label="Следующее фото">→</button>
    </div>
</div>
