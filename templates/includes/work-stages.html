<section class="work section container" aria-labelledby="work-title">
    <h2 id="work-title">Этапы работ — от подбора до запуска</h2>
    <p class="intro">Помогаем подобрать оборудование, спроектировать систему отопления и подготовить её к работе.</p>
    <ol class="work__steps four-columns" data-reveal-group data-scroll-panel="Список этапов работ">
        {% for title, description in work_stages %}
            <li data-reveal="up">
                <h3>{{ title }}</h3>
                <p>{{ description }}</p>
                <span class="step-number" aria-hidden="true">0{{ forloop.counter }}</span>
            </li>
        {% endfor %}
    </ol>
</section>
