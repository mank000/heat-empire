{% load static %}
<div class="messengers">
    {% for name, icon, url in contacts.messengers %}
        {% if url %}
            <a href="{{ url }}" aria-label="{{ name }}">
                <img src="{% static icon %}" width="32" height="32" alt="">
            </a>
        {% else %}
            <img src="{% static icon %}" width="32" height="32" alt="{{ name }}">
        {% endif %}
    {% endfor %}
</div>
