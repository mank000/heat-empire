{% csrf_token %}
<input type="hidden" name="source" value="{{ form.prefix }}">
{{ form.non_field_errors }}
<div class="quote__fields">
    {% for field in form %}
        {% if field.name != "consent" %}
            <div class="quote__field">
                <label class="visually-hidden" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endif %}
    {% endfor %}
</div>
<div class="quote__consent">
    {{ form.consent }}
    <div>
        <label for="{{ form.consent.id_for_label }}">{{ form.consent.label }}</label>.
        <a href="{% url 'privacy-policy' %}" target="_blank" rel="noopener" aria-label="Политика конфиденциальности (в новой вкладке)">Политика конфиденциальности</a>
    </div>
</div>
{{ form.consent.errors }}
<button class="button" type="submit">Рассчитать экономичное отопление</button>
