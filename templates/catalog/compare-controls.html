<div class="catalog-compare-controls" data-compare-controls tabindex="-1" hidden>
    <form action="{% url 'catalog-compare' %}" method="get">
        <div data-compare-inputs hidden></div>
        <button class="button" type="submit" data-compare-submit disabled>Сравнить (0)</button>
        <p role="status" data-compare-status>Выберите 2–3 модели одного типа.</p>
    </form>
    <ul class="catalog-compare-selection" data-compare-selection aria-label="Модели в сравнении" hidden></ul>
</div>
