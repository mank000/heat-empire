services:
  web:
    command: ["gunicorn", "heat_empire.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--access-logfile", "-"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${HEAT_PREVIEW_IP:?Set HEAT_PREVIEW_IP in .env},127.0.0.1
      DJANGO_PREVIEW: "1"
      DJANGO_HTTPS: "${HEAT_PREVIEW_HTTPS:-0}"
